# ─── Spring application name ─────────────────────────────────────────────
spring.application.name=crm-minimal

# ─── H2 DataSource ────────────────────────────────────────────────────────
# In-process H2 database; DB_CLOSE_DELAY=-1 keeps it alive for the JVM lifetime.
spring.datasource.url=jdbc:p6spy:h2:file:C:/IDD/gitworkspace/aiup-vaadin-holon/demo/crm-minimal/data/demodb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA (Holon JPA Datastore; schema owned by Flyway, so Hibernate must not auto-generate DDL) ─────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ─── Flyway (schema owned by src/main/resources/db/migration) ────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Holon Tenant ──────────────────────────────────────────────────────────
# Path-prefix resolution: /t/{tenantId}/... — no wildcard DNS or per-request
# header needed; matches FR-T-007's URL-navigable tenant switch.
holon.tenant.strategy=PATH
holon.tenant.path-prefix=/t/
holon.tenant.required=true
holon.tenant.ignored-paths=/,/login,/signup,/actuator/**,/public/**,/error,/VAADIN/**,/frontend/**,/vaadinServlet/**,/sw.js,/favicon.ico,/manifest.webmanifest,/offline.html,/aura/**,/icons/**,/images/**,/robots.txt

# ─── Holon Tenant Data (per-tenant schema isolation) ───────────────────────
# H2 dialect uses "SET SCHEMA <name>", not PostgreSQL's "SET search_path TO
# <name>" — required since this project runs on H2, not the framework's
# default (POSTGRESQL).
holon.tenant.data.schema-strategy=SCHEMA_PER_TENANT
holon.tenant.data.dialect=H2

# ─── Vaadin ────────────────────────────────────────────────────────────────
vaadin.launch-browser=false
vaadin.copilot.enable=false

# ─── Invitations ────────────────────────────────────────────────────────────
holon.saas.invitations.accept-base-url=http://localhost:8080/accept-invite

logging.level.com.holonplatform.multitenant.data=TRACE

